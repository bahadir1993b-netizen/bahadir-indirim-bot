name: Bahadir Indirim Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

# Marketplace taraması Telegram'ın hızlı 5 dakikalık taramasını bloklamaz.
concurrency:
  group: bahadir-marketplace-scanner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Otomatik çalışma kontrolü
        run: |
          echo "Marketplace bot çalışma zamanı: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Tetikleyici: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromium kur
        timeout-minutes: 4
        run: python -m playwright install chromium

      - name: Supabase bağlantı testi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_KEY"]
          r=requests.get(f"{url}/rest/v1/products?select=id&limit=1",headers={"apikey":key,"Content-Type":"application/json"},timeout=20)
          print(f"Supabase HTTP: {r.status_code}")
          print(f"Supabase cevap: {r.text[:500]}")
          r.raise_for_status()
          PY

      - name: Marketplace taraması
        timeout-minutes: 10
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: |
          python apply_priority_runtime_patch.py
          python apply_marketplace_runtime_patch.py
          python apply_scanner_runtime_patch.py
          python apply_speed_runtime_patch.py
          python marketplace_scanner.py
