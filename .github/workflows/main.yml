name: Bahadir Indirim Botu

# Marketplace katmanı runner açıkken kendi içinde 10 dakikalık döngüyle çalışır.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 */5 * * *"

concurrency:
  group: bahadir-marketplace-scanner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    steps:
      - name: Otomatik çalışma kontrolü
        run: |
          echo "Marketplace sürekli tarama başlıyor: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Tetikleyici: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromium kur
        timeout-minutes: 4
        run: python -m playwright install chromium

      - name: Supabase bağlantı testi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_KEY"]
          r=requests.get(f"{url}/rest/v1/products?select=id&limit=1",headers={"apikey":key,"Content-Type":"application/json"},timeout=20)
          print(f"Supabase HTTP: {r.status_code}")
          print(f"Supabase cevap: {r.text[:500]}")
          r.raise_for_status()
          PY

      - name: Marketplace 10 dakikalık sürekli tarama
        timeout-minutes: 330
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: |
          set -u
          end=$((SECONDS + 31500))
          cycle=0
          while [ "$SECONDS" -lt "$end" ]; do
            cycle=$((cycle + 1))
            cycle_start=$SECONDS
            echo "=== Marketplace tarama #$cycle | $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

            # Amazon koduna dokunmadan Hepsiburada + Trendyol için ayrı keşif katmanı.
            # İlk gözlemde arama kartındaki eski fiyat kesinlikle referans alınmaz.
            python apply_historical_reference_guard.py
            timeout 180s python marketplace_nonamazon_scanner.py || echo "Hepsiburada/Trendyol taraması bu turda hata verdi; mevcut marketplace taramasına geçiliyor."

            # Mevcut marketplace motoru korunuyor. Yalnızca bağımsız keşifte
            # 'önceki fiyat' artık geçmişte gerçekten görülmüş fiyat olmak zorunda.
            sed -i 's/MIN_DISCOUNT = 10.0/MIN_DISCOUNT = 15.0/' marketplace_scanner.py
            python apply_scanner_runtime_patch.py
            python apply_marketplace_rescue_patch.py
            python apply_final_price_guard.py
            python apply_historical_reference_guard.py
            timeout 420s python marketplace_scanner.py || echo "Mevcut marketplace taraması bu turda hata verdi; sonraki tur devam edecek."

            remaining=$((end - SECONDS))
            if [ "$remaining" -le 0 ]; then break; fi
            elapsed=$((SECONDS - cycle_start))
            sleep_for=$((600 - elapsed))
            if [ "$sleep_for" -lt 0 ]; then sleep_for=0; fi
            if [ "$sleep_for" -gt "$remaining" ]; then sleep_for="$remaining"; fi
            echo "Sonraki marketplace turu ${sleep_for} saniye sonra."
            sleep "$sleep_for"
          done
