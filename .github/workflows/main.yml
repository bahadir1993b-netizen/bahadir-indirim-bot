name: Bahadir Indirim Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

# Schedule yalnızca yedek başlatıcıdır. Ana döngü kendi kendini yeniden tetikler.
# Böylece GitHub scheduler gecikse/kaçırsa bile bot tekrar çalıştırılır.

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Otomatik çalışma kontrolü
        run: |
          echo "Bot çalışma zamanı: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Tetikleyici: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Chromium kur
        timeout-minutes: 4
        run: python -m playwright install chromium

      - name: Supabase bağlantı testi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_KEY"]
          r=requests.get(f"{url}/rest/v1/products?select=id&limit=1",headers={"apikey":key,"Content-Type":"application/json"},timeout=20)
          print(f"Supabase HTTP: {r.status_code}")
          print(f"Supabase cevap: {r.text[:500]}")
          r.raise_for_status()
          PY

      - name: Telegram reklam kaynaklarını önceliklendir
        run: python apply_priority_runtime_patch.py

      - name: Telegram kaynak taraması
        timeout-minutes: 3
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: |
          python apply_telegram_runtime_patch.py
          sed -i 's/^MAX_AGE=.*/MAX_AGE=15/' telegram_sources.py
          python telegram_sources.py

      - name: Marketplace fiyat doğrulama düzeltmesi
        run: python apply_marketplace_runtime_patch.py

      - name: Scanner çıktı düzeltmeleri
        run: python apply_scanner_runtime_patch.py

      - name: Scanner hız ve süre düzeltmesi
        run: python apply_speed_runtime_patch.py

      - name: Bağımsız internet fiyat taraması
        timeout-minutes: 8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: python marketplace_scanner.py

      # Her başarılı/başarısız taramadan sonra yeni bir run kuyruğa alınır.
      # Aynı workflow'un birbirini kilitlememesi için concurrency kullanılmıyor.
      - name: Sonraki taramayı kuyruğa al
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Yeni tarama tetikleniyor..."
          gh workflow run "Bahadir Indirim Botu" --repo "$REPO" --ref main
