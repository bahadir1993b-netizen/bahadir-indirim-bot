name: Bahadir Telegram Kaynak Tarama

# Telegram kaynakları hızlı katmandır: marketplace taramasından bağımsız çalışır.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bahadir-telegram-scanner
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gereksinimleri kur
        run: pip install -r requirements.txt
      - name: Chromium kur
        run: python -m playwright install --with-deps chromium
      - name: OCR motoru kur
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - name: Telegram kaynak önceliklerini uygula
        run: python apply_priority_runtime_patch.py
      - name: Telegram kaynak ve görsel düzeltmeleri
        run: python apply_telegram_runtime_patch.py
      - name: Telegram fırsat keşfi
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: |
          sed -i 's/^MAX_AGE=.*/MAX_AGE=45/' telegram_sources.py
          python telegram_sources.py
      - name: Görsel kupon ve kod OCR taraması
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ASSOCIATE_TAG: ozelfirsat09-21
        run: python telegram_image_ocr_v2.py
