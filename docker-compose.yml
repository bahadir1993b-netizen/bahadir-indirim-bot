services:
  serper-bot:
    build: .
    container_name: bahadir-serper-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1800}
      MAX_RESOLVE_PER_RUN: ${MAX_RESOLVE_PER_RUN:-60}
      MAX_MARKET_REF_PER_RUN: ${MAX_MARKET_REF_PER_RUN:-40}
      MAX_RENDER_CHECKS: ${MAX_RENDER_CHECKS:-20}
      NEGATIVE_CACHE_SECONDS: ${NEGATIVE_CACHE_SECONDS:-600}
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_serper_v3_reported.py; code=$$?; echo "Serper V3 turu bitti (kod=$$code). ${SCAN_INTERVAL:-1800} sn sonra tekrar."; sleep ${SCAN_INTERVAL:-1800}; done'

  telegram-bot:
    build: .
    container_name: bahadir-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_INTERVAL: ${TELEGRAM_INTERVAL:-60}
      TELEGRAM_MAX_AGE: ${TELEGRAM_MAX_AGE:-180}
    command: >-
      sh -c 'while true; do python run_telegram_realtime.py; code=$$?; echo "Telegram turu bitti (kod=$$code). ${TELEGRAM_INTERVAL:-60} sn sonra tekrar."; sleep ${TELEGRAM_INTERVAL:-60}; done'

  health:
    build: .
    container_name: bahadir-health
    restart: unless-stopped
    environment:
      HEALTH_PORT: 8787
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8787:8787"
    command: python health_server.py
