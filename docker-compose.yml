services:
  serper-bot:
    build: .
    container_name: bahadir-direct-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1800}
      DIRECT_MAX_PRODUCTS: ${DIRECT_MAX_PRODUCTS:-70}
      DIRECT_HISTORY_DAYS: ${DIRECT_HISTORY_DAYS:-90}
      DIRECT_HISTORY_WRITE_HOURS: ${DIRECT_HISTORY_WRITE_HOURS:-6}
      DIRECT_BROWSER_LIMIT: ${DIRECT_BROWSER_LIMIT:-25}
      DIRECT_COOLDOWN_HOURS: ${DIRECT_COOLDOWN_HOURS:-12}
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_direct_reported.py; code=$$?; echo "API-siz fiyat takip turu bitti (kod=$$code). ${SCAN_INTERVAL:-1800} sn sonra tekrar."; sleep ${SCAN_INTERVAL:-1800}; done'

  telegram-bot:
    build: .
    container_name: bahadir-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_INTERVAL: ${TELEGRAM_INTERVAL:-60}
      TELEGRAM_MAX_AGE: ${TELEGRAM_MAX_AGE:-180}
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    command: >-
      sh -c 'while true; do python run_telegram_realtime.py; code=$$?; echo "Telegram turu bitti (kod=$$code). ${TELEGRAM_INTERVAL:-60} sn sonra tekrar."; sleep ${TELEGRAM_INTERVAL:-60}; done'

  health:
    build: .
    container_name: bahadir-health
    restart: unless-stopped
    environment:
      HEALTH_PORT: 8787
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8787:8787"
    command: python health_server.py
