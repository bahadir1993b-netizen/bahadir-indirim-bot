      WEB_FIRST_MIN_DISCOUNT: ${WEB_FIRST_MIN_DISCOUNT:-15}
      WEB_FIRST_MAX_CHECK: ${WEB_FIRST_MAX_CHECK:-180}
      WEB_FIRST_BROWSER_LIMIT: ${WEB_FIRST_BROWSER_LIMIT:-35}
      LOCAL_PRICE_DB: /app/data/price_memory.db
