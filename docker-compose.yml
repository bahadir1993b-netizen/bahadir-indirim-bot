      FAST_LANE_MAX_AGE: ${FAST_LANE_MAX_AGE:-60}
      FAST_LANE_MIN_DISCOUNT: ${FAST_LANE_MIN_DISCOUNT:-5}
      LOCAL_PRICE_DB: /app/data/price_memory.db
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_trusted_fast_lane.py; code=$$?; echo "Öncelikli Telegram hızlı tur bitti (kod=$$code). ${FAST_LANE_INTERVAL:-30} sn sonra tekrar."; sleep ${FAST_LANE_INTERVAL:-30}; done'

  web-first-deals:
