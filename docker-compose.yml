services:
  serper-bot:
    build: .
    container_name: bahadir-direct-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-600}
      DIRECT_MAX_PRODUCTS: ${DIRECT_MAX_PRODUCTS:-120}
      DIRECT_BROWSER_LIMIT: ${DIRECT_BROWSER_LIMIT:-24}
      DIRECT_FRESH_SOURCE_HOURS: ${DIRECT_FRESH_SOURCE_HOURS:-4}
      LOCAL_PRICE_DB: /app/data/price_memory.db
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_direct_reported.py; code=$$?; echo "API-siz V4 fiyat takip turu bitti (kod=$$code). ${SCAN_INTERVAL:-600} sn sonra tekrar."; sleep ${SCAN_INTERVAL:-600}; done'

  telegram-bot:
    build: .
    container_name: bahadir-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_INTERVAL: ${TELEGRAM_INTERVAL:-60}
      TELEGRAM_MAX_AGE: ${TELEGRAM_MAX_AGE:-180}
      LOCAL_PRICE_DB: /app/data/price_memory.db
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_telegram_realtime.py; code=$$?; echo "Telegram turu bitti (kod=$$code). ${TELEGRAM_INTERVAL:-60} sn sonra tekrar."; sleep ${TELEGRAM_INTERVAL:-60}; done'

  price-sampler:
    build: .
    container_name: bahadir-price-sampler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_PRICE_DB: /app/data/price_memory.db
      PRICE_SAMPLE_INTERVAL: ${PRICE_SAMPLE_INTERVAL:-900}
      PRICE_SAMPLE_LIMIT: ${PRICE_SAMPLE_LIMIT:-220}
      PRICE_SAMPLE_SLEEP: ${PRICE_SAMPLE_SLEEP:-0.15}
      PRICE_SAMPLE_DEAL_PCT: ${PRICE_SAMPLE_DEAL_PCT:-15}
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_price_sampler.py; code=$$?; echo "Sürekli fiyat örnekleme bitti (kod=$$code). ${PRICE_SAMPLE_INTERVAL:-900} sn sonra tekrar."; sleep ${PRICE_SAMPLE_INTERVAL:-900}; done'

  history-harvester:
    build: .
    container_name: bahadir-history-harvester
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_PRICE_DB: /app/data/price_memory.db
      HARVEST_INTERVAL: ${HARVEST_INTERVAL:-1800}
      HARVEST_PAGES_PER_RUN: ${HARVEST_PAGES_PER_RUN:-16}
      HARVEST_MAX_BLOCKS: ${HARVEST_MAX_BLOCKS:-900}
      SERPER_DISABLED: "1"
      SERPER_API_KEY: ""
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_history_harvester.py; code=$$?; echo "Telegram geçmiş hasadı bitti (kod=$$code). ${HARVEST_INTERVAL:-1800} sn sonra tekrar."; sleep ${HARVEST_INTERVAL:-1800}; done'

  onual-harvester:
    build: .
    container_name: bahadir-onual-harvester
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_PRICE_DB: /app/data/price_memory.db
      ONUAL_INTERVAL: ${ONUAL_INTERVAL:-1800}
      ONUAL_PAGES_PER_RUN: ${ONUAL_PAGES_PER_RUN:-30}
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_onual_harvester.py; code=$$?; echo "OnuAl arşiv hasadı bitti (kod=$$code). ${ONUAL_INTERVAL:-1800} sn sonra tekrar."; sleep ${ONUAL_INTERVAL:-1800}; done'

  akakce-enricher:
    build: .
    container_name: bahadir-akakce-enricher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_PRICE_DB: /app/data/price_memory.db
      AKAKCE_INTERVAL: ${AKAKCE_INTERVAL:-1800}
      AKAKCE_LIMIT: ${AKAKCE_LIMIT:-40}
      AKAKCE_SLEEP: ${AKAKCE_SLEEP:-0.7}
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_akakce_enricher.py; code=$$?; echo "Akakçe 24/7 zenginleştirme bitti (kod=$$code). ${AKAKCE_INTERVAL:-1800} sn sonra tekrar."; sleep ${AKAKCE_INTERVAL:-1800}; done'

  serper-seed:
    build: .
    container_name: bahadir-serper-seed
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_PRICE_DB: /app/data/price_memory.db
      SERPER_SEED_INTERVAL: ${SERPER_SEED_INTERVAL:-21600}
      SERPER_SEED_QUERIES: ${SERPER_SEED_QUERIES:-12}
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_serper_seed.py; code=$$?; echo "Serper seed turu bitti (kod=$$code). ${SERPER_SEED_INTERVAL:-21600} sn sonra tekrar."; sleep ${SERPER_SEED_INTERVAL:-21600}; done'

  health:
    build: .
    container_name: bahadir-health
    restart: unless-stopped
    environment:
      HEALTH_PORT: 8787
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8787:8787"
    command: python health_server.py
