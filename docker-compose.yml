services:
  indirim-bot:
    build: .
    container_name: bahadir-indirim-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1800}
    volumes:
      - ./data:/app/data
    command: >-
      sh -c 'while true; do python run_all.py; code=$$?; echo "Bot turu bitti (kod=$$code). ${SCAN_INTERVAL:-1800} sn sonra tekrar."; sleep ${SCAN_INTERVAL:-1800}; done'
